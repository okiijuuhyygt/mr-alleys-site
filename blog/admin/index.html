<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>專欄後台｜巷弄故事館</title>
<link rel="stylesheet" href="/css/blog.css?v=20260904b">
<style>
.box{border:2px solid var(--brass);background:var(--paper-soft);padding:16px;margin:0 0 16px}
input[type=password],input[type=search]{width:100%;font-size:16px;padding:12px;border:2px solid var(--ink);background:#fff;font-family:inherit}
label{display:block;font-size:.85rem;color:var(--ink-soft);margin:0 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{font-size:.9rem;color:var(--ink-soft);margin-top:10px}
.err{color:#b83a2a}
.list li{padding:9px 0;border-bottom:1px dashed var(--paper-edge)}
.list a{color:var(--ink);text-decoration:none;display:block}
.list .d{font-size:.78rem;color:var(--ink-mute)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/admin.html">← 回選單</a> <a class="back" href="/admin.html#home" style="margin-left:10px">主頁編輯</a>
  <div class="badge">MR.ALLEYS · 專欄後台</div>
  <h1>專欄後台</h1>

  <div class="box" id="loginBox">
    <label for="tok">通關碼（跟首頁後台同一組）</label>
    <input type="password" id="tok" autocomplete="off" placeholder="貼上通關碼">
    <div class="row"><button class="btn" id="loginBtn">登入</button></div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panel" hidden>
    <div class="box">
      <div>已登入。從下面的列表點一篇進去改，存檔後網站一到兩分鐘自己更新。</div>
      <div class="row"><a class="btn" href="/blog/">去專欄找文章 →</a><button class="btn" id="logoutBtn">登出</button></div>
    </div>
    <label for="q">或在這裡搜標題</label>
    <input type="search" id="q" placeholder="輸入關鍵字，例如 混音">
    <ul class="list" id="list"></ul>
  </div>
</div>
<script>
const OWNER='okiijuuhyygt', REPO='mr-alleys-site', LS='alleys-admin-token-v1';
const API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/';
const $=s=>document.querySelector(s);
async function verify(tok){ const r=await fetch(API+'blog-src?ref=main',{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'}}); return r.ok?await r.json():null; }
async function showPanel(tok){
  const items=await verify(tok); if(!items){ localStorage.removeItem(LS); $('#loginMsg').innerHTML='<span class="err">通關碼無效或已過期，請重新輸入。</span>'; return; }
  $('#loginBox').hidden=true; $('#panel').hidden=false;
  const mds=items.filter(x=>x.name.endsWith('.md')).map(x=>x.name.replace(/\.md$/,''));
  // 標題從 feed 拿不到全部，直接列 id，並抓 blog/index.html 的標題對照
  let titles={}; try{ const h=await (await fetch('/blog/index.html?t='+Date.now())).text(); for(const m of h.matchAll(/href="\/blog\/([^/"]+)\/">([^<]+)</g)) titles[m[1]]=m[2]; }catch(e){}
  const render=(q='')=>{ $('#list').innerHTML=mds.filter(id=>!q||(titles[id]||id).includes(q)||id.includes(q)).map(id=>`<li><a href="/blog/edit/?id=${id}">${titles[id]||id}<span class="d">${id}</span></a></li>`).join(''); };
  render(); $('#q').addEventListener('input',e=>render(e.target.value.trim()));
}
$('#loginBtn').onclick=async()=>{ const t=$('#tok').value.trim(); if(!t) return; $('#loginMsg').textContent='驗證中…'; const ok=await verify(t); if(ok){ localStorage.setItem(LS,t); $('#loginMsg').textContent=''; showPanel(t);} else $('#loginMsg').innerHTML='<span class="err">通關碼無效。</span>'; };
$('#tok').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#loginBtn').click(); });
$('#logoutBtn').onclick=()=>{ localStorage.removeItem(LS); location.reload(); };
const saved=localStorage.getItem(LS); if(saved) showPanel(saved);
</script>
</body>
</html>
