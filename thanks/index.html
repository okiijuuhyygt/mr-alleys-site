<style>
@font-face{font-family:"Cubic 11";src:url("/assets/Cubic_11_1.013_R.ttf") format("truetype");font-display:swap}
:root{--paper:#f3ead4;--paper-soft:#ede2c4;--paper-edge:#c9b88c;--ink:#2a1f12;
      --ink-soft:#5e4a30;--ink-mute:#8a7556;--brass:#b8801f;--brass-deep:#6e4d10}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Noto Sans TC","PingFang TC",sans-serif;line-height:1.9;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
.card{max-width:460px;text-align:center}
.kicker{font-family:"Cubic 11",monospace;font-size:11px;letter-spacing:.18em;
        color:var(--brass-deep);margin-bottom:20px}
h1{font-size:24px;line-height:1.55;margin:0 0 16px}
p{color:var(--ink-soft);font-size:15px;margin:0 0 14px}
.rule{width:56px;height:3px;background:var(--brass);margin:26px auto;
      box-shadow:3px 3px 0 var(--brass-deep)}
.note{background:var(--paper-soft);border-left:4px solid var(--brass);
      padding:13px 15px;text-align:left;font-size:14px;color:var(--ink-soft);margin:22px 0}
.btn{display:inline-block;font-family:"Cubic 11",monospace;font-size:13px;letter-spacing:.04em;
     color:var(--ink);background:var(--paper-soft);border:2px solid var(--brass);
     box-shadow:3px 3px 0 var(--brass-deep);padding:10px 18px;text-decoration:none;margin:6px 5px}
.btn:hover{background:#d4a13a}
.foot{margin-top:30px;font-size:12px;color:var(--ink-mute)}
.foot a{color:var(--brass-deep)}
</style>
</head>
<body>
<div class="card">
  <div class="kicker">MR.ALLEYS ｜ 巷弄故事館</div>
  <h1>信寄出去了</h1>
  <p>〈找人做歌之前，先搞懂的 10 件事〉已經寄到你填的信箱，<br>通常一兩分鐘內會到。</p>

  <div class="note">
    沒收到的話，先看一下<strong>促銷內容</strong>或<strong>垃圾郵件</strong>那一區——
    第一次收到我們的信常常會被丟到那裡。找到的話把它拉回主要收件匣，之後就不會了。
  </div>

  <div class="rule"></div>

  <p>看完如果想知道自己的歌卡在哪一段，<br>可以再填一份診斷，八題，大概一分鐘。</p>
